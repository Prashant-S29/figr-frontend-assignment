# Pings only Figr's two Render services; schedules are best-effort and do not bypass Free limits or guarantee uptime.
name: Render keepalive

on:
  schedule:
    - cron: '2-59/6 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping API and preview pages
        shell: bash
        run: |
          curl --fail --silent --show-error --location --max-redirs 5 \
            --connect-timeout 15 --max-time 90 --retry 1 --retry-delay 5 \
            --retry-all-errors --output /dev/null --write-out 'API: HTTP %{http_code}\n' \
            https://figr-viewer-api.onrender.com/screens &
          api_pid=$!
          curl --fail --silent --show-error --location --max-redirs 5 \
            --connect-timeout 15 --max-time 90 --retry 1 --retry-delay 5 \
            --retry-all-errors --output /dev/null --write-out 'Pages: HTTP %{http_code}\n' \
            https://figr-viewer-pages.onrender.com/page-1.html &
          pages_pid=$!
          status=0
          wait "$api_pid" || status=1
          wait "$pages_pid" || status=1
          exit "$status"
